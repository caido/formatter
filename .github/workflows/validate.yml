name: Validate formatter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate configuration on all supported systems
        run: nix flake check --all-systems --no-build --no-update-lock-file --show-trace
      - name: Build generated treefmt configuration
        run: nix build --no-link --no-update-lock-file .#config
      - name: Check formatting
        run: nix flake check --no-update-lock-file --show-trace
