[tools]
treefmt = "2.6.0"
python = "3.12.14"
node = "24.16.0"
"npm:oxfmt" = "0.53.0"
"npm:prettier" = "3.7.4"
ruff = "0.16.9"
opentofu = "1.9.1"
shfmt = "3.14.1"
stylua = "2.6.0"
rust = { version = "nightly-2026-04-06", profile = "minimal", components = "rustfmt" }

[tasks.format]
description = "Format this repository"
run = "bin/format self"

[tasks."format:check"]
description = "Check this repository's formatting (may rewrite files, as treefmt --ci does)"
run = "bin/format self --ci"

[tasks.test]
description = "Check configuration and formatter routing"
run = "python3 -m unittest discover -s tests -v"
