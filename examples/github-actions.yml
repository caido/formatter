name: Validate formatter configuration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: caido/action-mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: "2026.10.6"
          install: false
      - name: Validate configs and file routing
        run: |
          mise exec treefmt@2.6.0 python@3.12.14 -- treefmt --version
          mise exec treefmt@2.6.0 python@3.12.14 -- python3 -m unittest discover -s tests -v
