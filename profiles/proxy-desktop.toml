# Shared Caido formatting. Invoke through bin/format to resolve companion configs.
on-unmatched = "debug"
excludes = [".git/*", ".formatter/*", "node_modules/*", "*/node_modules/*", "dist/*", "*/dist/*", "target/*", "*/target/*", "coverage/*", "*/coverage/*", ".venv/*", "*/.venv/*", ".terraform/*", "*/.terraform/*", "*-lock.json", "pnpm-lock.yaml", "yarn.lock", "uv.lock", "*.min.js", "*.min.css", ".agents/*", ".claude/*", ".cursor/*", "**/__generated__/**"]

[formatter.prettier]
command = "sh"
options = ["-eu", "-c", "exec prettier --write --no-editorconfig --config \"$CAIDO_FORMATTER_ROOT/configs/prettier.json\" \"$@\"", "--"]
includes = ["packages/main/src/*.ts", "packages/main/src/*.js", "packages/ui/src/*.ts", "packages/ui/src/*.js", "packages/ui/src/*.vue", "packages/shared/src/*.ts", "packages/shared/src/*.js", "packages/migrations/src/*.ts", "packages/migrations/src/*.js"]
