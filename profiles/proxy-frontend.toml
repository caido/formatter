# Shared Caido formatting. Invoke through bin/format to resolve companion configs.
on-unmatched = "debug"
excludes = [".git/*", ".formatter/*", "node_modules/*", "*/node_modules/*", "dist/*", "*/dist/*", "target/*", "*/target/*", "coverage/*", "*/coverage/*", ".venv/*", "*/.venv/*", ".terraform/*", "*/.terraform/*", "*-lock.json", "pnpm-lock.yaml", "yarn.lock", "uv.lock", "*.min.js", "*.min.css", ".agents/*", ".claude/*", ".cursor/*", "**/__generated__/**", "packages/ui/src/@types/modules/vue-router.d.ts"]

[formatter.oxfmt]
command = "sh"
options = ["-eu", "-c", "exec oxfmt --write --config \"$CAIDO_FORMATTER_ROOT/configs/oxfmt.json\" \"$@\"", "--"]
includes = ["packages/*.ts", "packages/*.tsx", "packages/*.vue", "packages/*.js", "packages/*.mjs", "packages/*.cjs", "packages/*.json", "packages/*.css", "packages/*.scss", "packages/*.graphql", "packages/*.md", "packages/*.yml", "packages/*.yaml", "packages/*.html", "scripts/*.ts", "scripts/*.mjs", "scripts/*.js", ".github/*.yml", ".github/*.yaml"]
excludes = ["*.svg", "*.grammar"]

[formatter.oxfmt-root]
command = "sh"
options = ["-eu", "-c", "exec oxfmt --write --config \"$CAIDO_FORMATTER_ROOT/configs/oxfmt.json\" \"$@\"", "--"]
includes = ["*.ts", "*.mjs", "*.js", "*.json", "*.yml", "*.yaml"]
excludes = ["*/*"]
