# Shared Caido formatting. Invoke through bin/format to resolve companion configs.
on-unmatched = "debug"
excludes = [".git/*", ".formatter/*", "node_modules/*", "*/node_modules/*", "dist/*", "*/dist/*", "target/*", "*/target/*", "coverage/*", "*/coverage/*", ".venv/*", "*/.venv/*", ".terraform/*", "*/.terraform/*", "*-lock.json", "pnpm-lock.yaml", "yarn.lock", "uv.lock", "*.min.js", "*.min.css", ".agents/*", ".claude/*", ".cursor/*", "**/__generated__/**", "apps/transform/*"]

[formatter.ruff]
command = "sh"
options = ["-eu", "-c", "exec ruff format --force-exclude --config \"$CAIDO_FORMATTER_ROOT/configs/ruff-analytics.toml\" \"$@\"", "--"]
includes = ["apps/event_consumer/*.py", "apps/event_consumer/*.pyi", "apps/extract_and_load/*.py", "apps/extract_and_load/*.pyi", "apps/reconcile/*.py", "apps/reconcile/*.pyi", "apps/reverse_etl/*.py", "apps/reverse_etl/*.pyi"]
