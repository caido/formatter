# Shared Caido formatting. Invoke through bin/format to resolve companion configs.
on-unmatched = "debug"
excludes = [".git/*", ".formatter/*", "node_modules/*", "*/node_modules/*", "dist/*", "*/dist/*", "target/*", "*/target/*", "coverage/*", "*/coverage/*", ".venv/*", "*/.venv/*", ".terraform/*", "*/.terraform/*", "*-lock.json", "pnpm-lock.yaml", "yarn.lock", "uv.lock", "*.min.js", "*.min.css", ".agents/*", ".claude/*", ".cursor/*", "**/__generated__/**"]

[formatter.rustfmt]
command = "sh"
options = ["-eu", "-c", "exec rustup run nightly-2026-04-06 rustfmt --edition 2024 --config-path \"$CAIDO_FORMATTER_ROOT/configs/rustfmt/proxy-backend.toml\" --config skip_children=true \"$@\"", "--"]
includes = ["*.rs"]
excludes = ["proxy-tests/tests/common/macros/*"]

[formatter.prettier]
command = "sh"
options = ["-eu", "-c", "exec prettier --write --no-editorconfig --config \"$CAIDO_FORMATTER_ROOT/configs/prettier-backend.json\" \"$@\"", "--"]
includes = ["*.graphql"]
