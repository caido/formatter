unstable_features = true

edition = "2024"

# Currently rustfmt gives up on long strings
# See https://github.com/rust-lang/rustfmt/issues/3863
single_line_if_else_max_width = 80
group_imports = "StdExternalCrate"
imports_granularity = "Module"
error_on_line_overflow = false               # We have a couple case where this fails
error_on_unformatted = false
